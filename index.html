<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Экзамен АЭС</title>

  <!-- 1. VK Bridge загружается первым и инициализируется мгновенно -->
  <script src="https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@2.14.2/dist/browser.min.js"></script>
  <script>
    try {
      if (window.vkBridge) {
        window.vkBridge.send('VKWebAppInit');
      }
    } catch (e) {}
  </script>

  <!-- 2. Telegram SDK подключается динамически только вне VK, исключая зависание -->
  <script>
    (function() {
      var isVkEnv = window.location.search.indexOf('vk_') !== -1 || ('vkBridge' in window);
      if (!isVkEnv) {
        var s = document.createElement('script');
        s.src = "https://telegram.org/js/telegram-web-app.js";
        s.async = true;
        document.head.appendChild(s);
      }
    })();
  </script>
 
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #111111;
      --subtext-color: #666666;
      --btn-bg: #2688eb;
      --btn-text: #ffffff;
      --card-bg: #f4f6f9;
      --card-border: rgba(0, 0, 0, 0.08);
      --correct-bg: #d4edda;
      --correct-border: #c3e6cb;
      --correct-text: #155724;
      --wrong-bg: #f8d7da;
      --wrong-border: #f5c6cb;
      --wrong-text: #721c24;
      --setting-row-border: #e2e8f0;
      --nav-btn-bg: #4a5568;
      --accent-stat: #0284c7;
      --badge-bg: rgba(38, 136, 235, 0.12);
      --badge-color: #0369a1;
      --highlight-correct: #c3e6cb;
      --float-btn-bg: #ffffff;
      --float-btn-color: #2688eb;
      --float-btn-shadow: 0 4px 16px rgba(0, 0, 0, 0.16);
    }
 
    [data-theme="dark"] {
      --bg-color: #1e2749;
      --text-color: #f0f4fc;
      --subtext-color: #a8bce3;
      --btn-bg: #4d3153;
      --btn-text: #ffffff;
      --card-bg: #151b33;
      --card-border: #2d3863;
      --correct-bg: #1b4332;
      --correct-border: #2d6a4f;
      --correct-text: #d8f3dc;
      --wrong-bg: #5c1d24;
      --wrong-border: #842029;
      --wrong-text: #f8d7da;
      --setting-row-border: #2d3863;
      --nav-btn-bg: #4d3153;
      --accent-stat: #dfa4ec;
      --badge-bg: rgba(223, 164, 236, 0.15);
      --badge-color: #f3c2fd;
      --highlight-correct: #235e40;
      --float-btn-bg: #2d3863;
      --float-btn-color: #dfa4ec;
      --float-btn-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
 
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 15px;
      line-height: 1.4;
      text-align: left;
      transition: background-color 0.2s, color 0.2s;
    }
    h1 {
      font-size: 22px;
      margin-top: 5px;
      margin-bottom: 12px;
      text-align: center;
    }
    .page { display: none; }
    .active { display: block; }
    .btn, button {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 14px;
      background: var(--btn-bg);
      color: var(--btn-text);
      text-decoration: none;
      text-align: center;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      border: 1px solid var(--card-border);
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.12s ease;
    }
    .btn:active, button:active {
      transform: scale(0.97);
      opacity: 0.88;
    }
    .btn-nav {
      margin-top: 12px;
      margin-bottom: 15px;
      background: var(--nav-btn-bg);
      font-size: 14px;
      padding: 11px;
    }
    .btn-reset {
      background: #b91c1c;
      color: #fff;
      font-size: 14px;
      padding: 12px;
      margin-top: 20px;
    }
    .q {
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      padding: 14px;
      margin: 12px 0;
      border-radius: 12px;
      text-align: left;
      transition: all 0.25s ease;
    }
    .q b {
      display: block;
      margin-bottom: 10px;
      font-size: 15px;
      line-height: 1.35;
      text-align: left;
    }
    label {
      display: flex;
      align-items: flex-start;
      margin: 8px 0;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
      gap: 10px;
      text-align: left;
      transition: background-color 0.15s;
    }
    label span { text-align: left; }
    label:active { opacity: 0.65; }
    label.answer-correct-highlight {
      background: var(--highlight-correct) !important;
      font-weight: 600;
      border: 1px solid var(--correct-border);
    }
    input[type=radio] {
      margin-top: 3px;
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      accent-color: var(--btn-bg);
    }
    .correct {
      background: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-text) !important;
    }
    .wrong {
      background: var(--wrong-bg) !important;
      border-color: var(--wrong-border) !important;
      color: var(--wrong-text) !important;
    }
    #examResult {
      margin-top: 15px;
      text-align: center;
    }
 
    .search-input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-color);
      font-size: 15px;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: var(--btn-bg);
    }

    .exam-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-weight: 600;
      font-size: 14px;
    }
    .timer-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--accent-stat);
    }

    .setting-group {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .setting-group h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
      color: var(--text-color);
    }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
    }
    .setting-label-text {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-color);
    }
    .badge-mobile {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: var(--badge-color);
      background: var(--badge-bg);
      padding: 3px 8px;
      border-radius: 6px;
      margin-top: 4px;
    }
    .platform-note {
      font-size: 12px;
      color: var(--subtext-color);
      margin-top: 6px;
      line-height: 1.3;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 28px;
      margin: 0;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #777;
      transition: .3s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--btn-bg);
    }
    input:checked + .slider:before {
      transform: translateX(22px);
    }
    .switch-disabled {
      opacity: 0.45;
      cursor: not-allowed !important;
      pointer-events: none;
    }
    .theme-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }
 
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .stat-count {
      color: var(--accent-stat);
      font-size: 15px;
      font-weight: bold;
    }
    #stat-total {
      color: var(--accent-stat);
      font-size: 26px;
      font-weight: bold;
    }
    .progress-bar-bg {
      background: rgba(0,0,0,0.15);
      border-radius: 8px;
      height: 10px;
      overflow: hidden;
    }
    .progress-bar-fill {
      background: var(--btn-bg);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .wb-scroll-top {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      right: 20px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--float-btn-bg);
      color: var(--float-btn-color);
      border: 1px solid var(--card-border);
      box-shadow: var(--float-btn-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.7) translateY(15px);
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), visibility 0.25s;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    .wb-scroll-top.visible {
      opacity: 0.96;
      visibility: visible;
      transform: scale(1) translateY(0);
    }
    .wb-scroll-top:active { transform: scale(0.9); }
    .wb-scroll-top svg {
      width: 22px;
      height: 22px;
      stroke-width: 2.6;
      stroke: currentColor;
    }
  </style>
</head>
<body data-theme="light">
 
<!-- Главное меню -->
<div id="home" class="page active">
  <h1>Экзамен АЭС</h1>
  <p style="text-align:center;color:var(--subtext-color);margin-bottom:24px;font-size:14px;">Проверка знаний нормативно-технической документации</p>
  <button class="btn" onclick="showPage('prepMenu')">Подготовка к экзамену</button>
  <button class="btn" onclick="generateExam()">Сдать экзамен (20 вопросов)</button>
  <button class="btn" onclick="openResultsPage()">Результаты</button>
  <button class="btn" onclick="showPage('settings')">Настройки</button>
</div>
 
<!-- Экран: Результаты -->
<div id="results" class="page">
  <h1>Результаты</h1>
  <button class="btn btn-nav" onclick="showPage('home')">← На главную</button>
 
  <div class="stat-card">
    <div class="stat-header">
      <span>НП-068-05</span>
      <span class="stat-count" id="stat-np068">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="bar-np068"></div>
    </div>
  </div>
 
  <div class="stat-card">
    <div class="stat-header">
      <span>НП-089-15</span>
      <span class="stat-count" id="stat-np089">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="bar-np089"></div>
    </div>
  </div>
 
  <div class="stat-card">
    <div class="stat-header">
      <span>ПНАЭ Г-7-010-89</span>
      <span class="stat-count" id="stat-pnaeg">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="bar-pnaeg"></div>
    </div>
  </div>
 
  <div class="setting-group" style="margin-top: 20px; text-align: center;">
    <div style="font-size: 14px; color: var(--subtext-color); margin-bottom: 6px;">Общий прогресс базы:</div>
    <div id="stat-total">0%</div>
  </div>
 
  <button class="btn btn-reset" onclick="confirmResetStatistics()">Сбросить прогресс</button>
  <button class="btn btn-nav" onclick="showPage('home')">← На главную</button>
</div>
 
<!-- Экран: Настройки -->
<div id="settings" class="page">
  <h1>Настройки</h1>
  <button class="btn btn-nav" onclick="showPage('home')">← На главную</button>
 
  <div class="setting-group">
    <div class="setting-row">
      <div>
        <div class="setting-label-text">Вибрация при нажатии</div>
        <div class="badge-mobile">📱 Только для мобильной версии</div>
      </div>
      <label class="switch" id="hapticSwitchContainer">
        <input type="checkbox" id="hapticToggle" onchange="toggleHaptic(this.checked)">
        <span class="slider"></span>
      </label>
    </div>
    <div id="hapticPlatformNote" class="platform-note"></div>
  </div>
 
  <div class="setting-group">
    <h3>Оформление экрана</h3>
    <div class="theme-options">
      <label>
        <input type="radio" name="themeSelect" value="light" onchange="applyTheme('light')">
        <span>Светлая</span>
      </label>
      <label>
        <input type="radio" name="themeSelect" value="dark" onchange="applyTheme('dark')">
        <span>Темная</span>
      </label>
    </div>
  </div>

  <button class="btn btn-nav" onclick="showPage('home')">← На главную</button>
</div>
 
<!-- Экран: Выбор раздела -->
<div id="prepMenu" class="page">
  <h1>Выберите раздел</h1>
  <button class="btn btn-nav" onclick="showPage('home')">← На главную</button>
  <button class="btn" onclick="openSection('НП068', 'НП-068-05 (Трубопроводная арматура для АЭУ)')">НП-068-05</button>
  <button class="btn" onclick="openSection('НП089', 'НП-089-15 (Оборудование и трубопроводы АЭУ)')">НП-089-15</button>
  <button class="btn" onclick="openSection('ПНАЭГ010', 'ПНАЭ Г-7-010-89 (Контроль сварных соединений и наплавки)')">ПНАЭ Г-7-010-89</button>
  <button class="btn btn-nav" onclick="showPage('home')">← На главную</button>
</div>
 
<!-- Экран: Вопросы раздела -->
<div id="prep" class="page">
  <h1 id="prepTitle">Подготовка</h1>
  <button class="btn btn-nav" onclick="showPage('prepMenu')">← Назад к разделам</button>
  <input type="text" id="prepSearchInput" class="search-input" placeholder="🔍 Поиск по вопросам в разделе..." oninput="filterPrepQuestions(this.value)">
  <div id="prepContent"></div>
  <button class="btn btn-nav" onclick="showPage('prepMenu')">← Назад к разделам</button>
</div>
 
<!-- Экран: Экзамен -->
<div id="exam" class="page">
  <h1>Сдать экзамен</h1>
  <div class="exam-status-bar">
    <span class="timer-badge">⏱ <span id="examTimer">20:00</span></span>
    <span id="examProgressCount">Отвечено: 0 / 20</span>
  </div>
  <button class="btn btn-nav" onclick="quitExamConfirm()">← На главную</button>
  <div id="examContent"></div>
  <button class="btn" id="finishExamBtn" onclick="finishExam()">Завершить экзамен</button>
  <div id="examResult"></div>
  <button class="btn btn-nav" onclick="quitExamConfirm()">← На главную</button>
</div>

<button id="wbScrollTopBtn" class="wb-scroll-top" onclick="scrollToTop()" aria-label="Вернуться наверх">
  <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="18 15 12 9 6 15"></polyline>
  </svg>
</button>
 
<script>
var memStorage = {};
var storage = {
  getItem: function(key) {
    try { return window.localStorage.getItem(key); } catch (e) { return memStorage[key] || null; }
  },
  setItem: function(key, val) {
    try { window.localStorage.setItem(key, val); } catch (e) { memStorage[key] = String(val); }
  },
  removeItem: function(key) {
    try { window.localStorage.removeItem(key); } catch (e) { delete memStorage[key]; }
  }
};

function isMobileDevice() {
  var ua = navigator.userAgent || '';
  var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
  var hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  return isMobileUA || (hasTouch && window.innerWidth <= 1024);
}

var isMobile = isMobileDevice();
var hapticEnabled = storage.getItem('aes_haptic') !== 'false';
var currentTheme = storage.getItem('aes_theme') || 'light';

function initHapticUI() {
  var toggleEl = document.getElementById('hapticToggle');
  var switchContainer = document.getElementById('hapticSwitchContainer');
  var noteEl = document.getElementById('hapticPlatformNote');

  if (!isMobile) {
    if (toggleEl) { toggleEl.checked = false; toggleEl.disabled = true; }
    if (switchContainer) switchContainer.classList.add('switch-disabled');
    if (noteEl) noteEl.innerHTML = '⚠️ Функция не поддерживается на ПК (активна только на смартфонах).';
  } else {
    if (toggleEl) toggleEl.checked = hapticEnabled;
    if (noteEl) noteEl.innerHTML = 'Легкий тактильный отклик при нажатии на кнопки и варианты ответов.';
  }
}

function applyTheme(theme) {
  currentTheme = theme;
  storage.setItem('aes_theme', theme);
  document.body.setAttribute('data-theme', theme);
  var radio = document.querySelector('input[name="themeSelect"][value="' + theme + '"]');
  if (radio) radio.checked = true;
}

function toggleHaptic(val) {
  hapticEnabled = val;
  storage.setItem('aes_haptic', val);
  if (val) triggerHaptic('light');
}

function triggerHaptic(type) {
  if (!hapticEnabled) return;
  type = type || 'light';

  // Прямой системный виброотклик
  if (navigator.vibrate) {
    try {
      if (type === 'success') {
        navigator.vibrate(22);
      } else if (type === 'error') {
        navigator.vibrate([18, 45, 18, 45, 18]);
      } else {
        navigator.vibrate(18);
      }
    } catch (e) {}
  }

  // Для Telegram (если открыто внутри TG)
  if (window.Telegram?.WebApp?.initData && window.Telegram.WebApp.HapticFeedback) {
    try {
      if (type === 'success') window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
      else if (type === 'error') window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
      else window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
      return;
    } catch (e) {}
  }

  // Для VK (если открыто внутри VK)
  var bridge = window.vkBridge?.default || window.vkBridge;
  if (bridge && typeof bridge.send === 'function' && typeof bridge.isWebView === 'function' && bridge.isWebView()) {
    try {
      if (type === 'error') {
        bridge.send('VKWebAppTapticNotificationOccurred', { result: 'error' }).catch(function() {});
      } else {
        bridge.send('VKWebAppTapticImpactOccurred', { style: 'light' }).catch(function() {});
      }
    } catch (e) {}
  }
}

document.addEventListener('pointerdown', function(e) {
  if (e.target.closest('#prepContent label, #prepContent input')) {
    return;
  }
  if (e.target.closest('button, .btn, label, input[type=radio]')) {
    triggerHaptic('light');
  }
});

function scrollToTop() {
  triggerHaptic('light');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateScrollTopButton() {
  var btn = document.getElementById('wbScrollTopBtn');
  if (!btn) return;
  var isTargetPage = document.getElementById('prep').classList.contains('active') ||
                     document.getElementById('exam').classList.contains('active');
  if (isTargetPage && window.scrollY > 280) {
    btn.classList.add('visible');
  } else {
    btn.classList.remove('visible');
  }
}

window.addEventListener('scroll', updateScrollTopButton, { passive: true });

function getSavedAnswers() {
  try {
    return JSON.parse(storage.getItem('aes_correct_answers')) || { "НП068": [], "НП089": [], "ПНАЭГ010": [] };
  } catch (e) {
    return { "НП068": [], "НП089": [], "ПНАЭГ010": [] };
  }
}

function recordCorrectAnswer(section, questionIdx) {
  var store = getSavedAnswers();
  if (!store[section]) store[section] = [];
  if (!store[section].includes(questionIdx)) {
    store[section].push(questionIdx);
    storage.setItem('aes_correct_answers', JSON.stringify(store));
  }
}

function openResultsPage() {
  var store = getSavedAnswers();
  var c1 = (store["НП068"] || []).length;
  var c2 = (store["НП089"] || []).length;
  var c3 = (store["ПНАЭГ010"] || []).length;
  var t1 = DATA["НП068"].length;
  var t2 = DATA["НП089"].length;
  var t3 = DATA["ПНАЭГ010"].length;
  var p1 = Math.round(c1 / t1 * 100);
  var p2 = Math.round(c2 / t2 * 100);
  var p3 = Math.round(c3 / t3 * 100);

  document.getElementById('stat-np068').innerText = c1 + ' из ' + t1 + ' (' + p1 + '%)';
  document.getElementById('bar-np068').style.width = p1 + '%';
  document.getElementById('stat-np089').innerText = c2 + ' из ' + t2 + ' (' + p2 + '%)';
  document.getElementById('bar-np089').style.width = p2 + '%';
  document.getElementById('stat-pnaeg').innerText = c3 + ' из ' + t3 + ' (' + p3 + '%)';

function showPage(id) {
  document.querySelectorAll('.page').forEach(function(x) { x.classList.remove('active'); });
  var target = document.getElementById(id);
  if (target) target.classList.add('active');
  window.scrollTo(0, 0);
  updateScrollTopButton();
}

function openSection(key, title) {
  document.getElementById('prepTitle').innerText = title;
  var searchInput = document.getElementById('prepSearchInput');
  if (searchInput) searchInput.value = '';
  var html = '';
  DATA[key].forEach(function(q, i) {
    html += createQuestion(q, i, key, true, key, i);
  });
  document.getElementById('prepContent').innerHTML = html;
  showPage('prep');
}

function filterPrepQuestions(val) {
  val = (val || '').trim().toLowerCase();
  var questions = document.querySelectorAll('#prepContent .q');
  questions.forEach(function(el) {
    var text = el.innerText.toLowerCase();
    el.style.display = text.indexOf(val) !== -1 ? 'block' : 'none';
  });
  updateScrollTopButton();
}

function createQuestion(q, idx, prefix, learnMode, secKey, origIdx) {
  var h = '<div class="q" data-qidx="' + idx + '"><b>' + (idx + 1) + '. ' + q.q.replace(/\n/g, '<br>') + '</b>';
  q.answers.forEach(function(a, i) {
    var formattedAnswer = a.replace(/\n/g, '<br>');
    var clickHandler = learnMode 
      ? 'checkAnswer(this, ' + q.correct + ', ' + i + ', \'' + secKey + '\', ' + origIdx + ')'
      : 'updateExamProgress()';
    h += '<label><input type="radio" name="' + prefix + '_' + idx + '" onclick="' + clickHandler + '"> <span>' + formattedAnswer + '</span></label>';
  });
  h += '</div>';
  return h;
}

function checkAnswer(el, correct, selected, secKey, origIdx) {
  var box = el.closest('.q');
  if (selected !== correct) {
    box.classList.remove('correct');
    box.classList.add('wrong');
    triggerHaptic('error');
  } else {
    box.classList.remove('wrong');
    box.classList.add('correct');
    triggerHaptic('success');
    if (secKey && origIdx !== undefined) recordCorrectAnswer(secKey, origIdx);
  }
}

function sampleWithIndex(arr, secKey, n) {
  var list = arr.map(function(item, idx) { return { q: item, secKey: secKey, origIdx: idx }; });
  for (var i = list.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = list[i];
    list[i] = list[j];
    list[j] = temp;
  }
  return list.slice(0, n);
}

var examTimerInterval = null;
var examSecondsRemaining = 1200;

function updateExamProgress() {
  var answered = document.querySelectorAll('#examContent .q input[type=radio]:checked').length;
  var progressEl = document.getElementById('examProgressCount');
  if (progressEl) progressEl.innerText = 'Отвечено: ' + answered + ' / 20';
}

function startExamTimer() {
  clearInterval(examTimerInterval);
  examSecondsRemaining = 1200;
  var timerEl = document.getElementById('examTimer');
  function renderTime() {
    var m = Math.floor(examSecondsRemaining / 60);
    var s = examSecondsRemaining % 60;
    if (timerEl) {
      timerEl.innerText = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
      timerEl.style.color = examSecondsRemaining <= 180 ? '#ef4444' : 'var(--accent-stat)';
    }
  }
  renderTime();
  examTimerInterval = setInterval(function() {
    examSecondsRemaining--;
    if (examSecondsRemaining <= 0) {
      clearInterval(examTimerInterval);
      alert('Время экзамена истекло!');
      finishExam();
    } else {
      renderTime();
    }
  }, 1000);
}

function quitExamConfirm() {
  if (document.getElementById('finishExamBtn').style.display === 'none') {
    showPage('home');
    return;
  }
  if (confirm('Прервать экзамен? Текущие результаты не будут сохранены.')) {
    clearInterval(examTimerInterval);
    showPage('home');
  }
}

function generateExam() {
  showPage('exam');
  document.getElementById('finishExamBtn').style.display = 'block';
  document.getElementById('examResult').innerHTML = '';
  document.getElementById('examProgressCount').innerText = 'Отвечено: 0 / 20';

  var exam = [].concat(
    sampleWithIndex(DATA["НП068"], "НП068", 6),
    sampleWithIndex(DATA["НП089"], "НП089", 6),
    sampleWithIndex(DATA["ПНАЭГ010"], "ПНАЭГ010", 8)
  );

  for (var i = exam.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = exam[i];
    exam[i] = exam[j];
    exam[j] = temp;
  }

  window.currentExam = exam;
  var html = '';
  exam.forEach(function(item, i) {
    html += createQuestion(item.q, i, 'exam', false, item.secKey, item.origIdx);
  });
  document.getElementById('examContent').innerHTML = html;
  startExamTimer();
}

function finishExam() {
  clearInterval(examTimerInterval);
  document.getElementById('finishExamBtn').style.display = 'none';

  var score = 0;
  var questions = document.querySelectorAll('#examContent .q');
  questions.forEach(function(q, i) {
    var checked = q.querySelector('input[type=radio]:checked');
    var examItem = window.currentExam[i];
    var radios = Array.prototype.slice.call(q.querySelectorAll('input[type=radio]'));
    var labels = q.querySelectorAll('label');

    radios.forEach(function(r) { r.disabled = true; });

    if (labels[examItem.q.correct]) {
      labels[examItem.q.correct].classList.add('answer-correct-highlight');
    }

    if (checked) {
      var selected = radios.indexOf(checked);
      if (selected === examItem.q.correct) {
        score++;
        q.classList.add('correct');
        recordCorrectAnswer(examItem.secKey, examItem.origIdx);
      } else {
        q.classList.add('wrong');
      }
    } else {
      q.classList.add('wrong');
    }
  });

  var percent = Math.round(score * 100 / window.currentExam.length);
  var passed = percent >= 80;
  triggerHaptic(passed ? 'success' : 'error');

  var statusColor = passed ? 'var(--correct-text)' : 'var(--wrong-text)';
  var statusBg = passed ? 'var(--correct-bg)' : 'var(--wrong-bg)';
  var statusBorder = passed ? 'var(--correct-border)' : 'var(--wrong-border)';

  document.getElementById('examResult').innerHTML =
    '<div class="q" style="background:' + statusBg + '; border-color:' + statusBorder + '; color:' + statusColor + '; font-weight: bold; font-size: 17px; text-align: center; padding: 18px;">' +
       'Результат: ' + score + ' из ' + window.currentExam.length + ' (' + percent + '%)<br>' +
       (passed ? '🎉 Экзамен успешно сдан!' : '❌ Экзамен не сдан. Ниже показаны ошибки и правильные ответы.') +
       '<button class="btn" style="margin-top: 15px;" onclick="generateExam()">Попробовать снова</button>' +
       '<button class="btn btn-nav" onclick="showPage(\'home\')">Вернуться на главную</button>' +
     '</div>';

  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

applyTheme(currentTheme);
</script>
</body>

<script>
function crc32(buf) {
  var table = new Uint32Array(256);
  for (var i = 0; i < 256; i++) {
    var c = i;
    for (var k = 0; k < 8; k++) c = ((c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1));
    table[i] = c;
  }
  var crc = 0 ^ (-1);
  for (var j = 0; j < buf.length; j++) {
    crc = (crc >>> 8) ^ table[(crc ^ buf[j]) & 0xFF];
  }
  return (crc ^ (-1)) >>> 0;
}

function buildZip() {
  var status = document.getElementById('status');
  status.style.color = '#0284c7';
  status.innerText = 'Создание архива...';

  try {
    var content = document.getElementById('sourceCode').value;
    var enc = new TextEncoder();
    var fileData = enc.encode(content);
    var nameData = enc.encode("index.html");
    var crc = crc32(fileData);
    var size = fileData.length;

    var lh = new Uint8Array(30 + nameData.length);
    var dvLh = new DataView(lh.buffer);
    dvLh.setUint32(0, 0x04034b50, true);
    dvLh.setUint16(4, 20, true);
    dvLh.setUint16(6, 0x0800, true);
    dvLh.setUint16(8, 0, true);
    dvLh.setUint16(10, 0, true);
    dvLh.setUint16(12, 0, true);
    dvLh.setUint32(14, crc, true);
    dvLh.setUint32(18, size, true);
    dvLh.setUint32(22, size, true);
    dvLh.setUint16(26, nameData.length, true);
    dvLh.setUint16(28, 0, true);
    lh.set(nameData, 30);

    var cd = new Uint8Array(46 + nameData.length);
    var dvCd = new DataView(cd.buffer);
    dvCd.setUint32(0, 0x02014b50, true);
    dvCd.setUint16(4, 20, true);
    dvCd.setUint16(6, 20, true);
    dvCd.setUint16(8, 0x0800, true);
    dvCd.setUint16(10, 0, true);
    dvCd.setUint16(12, 0, true);
    dvCd.setUint16(14, 0, true);
    dvCd.setUint32(16, crc, true);
    dvCd.setUint32(20, size, true);
    dvCd.setUint32(24, size, true);
    dvCd.setUint16(28, nameData.length, true);
    dvCd.setUint16(30, 0, true);
    dvCd.setUint16(32, 0, true);
    dvCd.setUint16(34, 0, true);
    dvCd.setUint16(36, 0, true);
    dvCd.setUint32(38, 0, true);
    dvCd.setUint32(42, 0, true);
    cd.set(nameData, 46);

    var eocd = new Uint8Array(22);
    var dvEocd = new DataView(eocd.buffer);
    dvEocd.setUint32(0, 0x06054b50, true);
    dvEocd.setUint16(4, 0, true);
    dvEocd.setUint16(6, 0, true);
    dvEocd.setUint16(8, 1, true);
    dvEocd.setUint16(10, 1, true);
    dvEocd.setUint32(12, cd.length, true);
    dvEocd.setUint32(16, lh.length + fileData.length, true);
    dvEocd.setUint16(20, 0, true);

    var blob = new Blob([lh, fileData, cd, eocd], { type: 'application/zip' });
    var link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "exam_aes_apk.zip";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);

    status.style.color = '#155724';
    status.innerText = '✅ Архив exam_aes_apk.zip успешно скачан!';
  } catch (err) {
    status.style.color = '#b91c1c';
    status.innerText = 'Ошибка: ' + err.message;
  }
}
</script>
